name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Unit tests (no Revit)
        run: dotnet test tests/BIMRadar.ClashNavigator.Tests/BIMRadar.ClashNavigator.Tests.csproj -c Release

      - name: Build Revit 2022 (net48)
        run: dotnet build src/BIMRadar.ClashNavigator/BIMRadar.ClashNavigator.csproj -c Release -p:RevitVersion=2022

      - name: Build Revit 2025 (net8.0-windows)
        run: dotnet build src/BIMRadar.ClashNavigator/BIMRadar.ClashNavigator.csproj -c Release -p:RevitVersion=2025

      - name: Build Revit 2027 (net10.0-windows)
        run: dotnet build src/BIMRadar.ClashNavigator/BIMRadar.ClashNavigator.csproj -c Release -p:RevitVersion=2027

      - name: Pack zips
        run: pwsh -File tools/pack.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: BIMRadar-ClashNavigator-pyRevit
          path: dist/BIMRadar-ClashNavigator-pyRevit.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BIMRadar-ClashNavigator-Standalone
          path: dist/BIMRadar-ClashNavigator-Standalone.zip

      - name: Publish unzipped build to test-build branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/test-build"
          rm -rf "$OUT"
          mkdir -p "$OUT/pyRevit"
          cp -r dist/pyRevit/BIMRadar-ClashNavigator.extension "$OUT/pyRevit/BIMRadar-ClashNavigator.extension"
          cp -r dist/Standalone "$OUT/Standalone"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$OUT/BUILD.txt"
          cd "$OUT"
          # Fresh repo with no .gitignore, so bin/ folders (and DLLs) are kept.
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git checkout -b test-build
          git add -A
          git commit -m "Test build ${GITHUB_SHA::7}"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git test-build
